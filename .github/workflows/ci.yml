name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install jsonschema==4.22.0
      - run: node node_modules/playwright-core/cli.js install --with-deps chrome
      - run: npm run build
      - run: npm test
      - run: npm run test:cli
      - run: npm run licenses:check
      - run: python scripts/validate-project.py
      - run: node scripts/check-release-boundaries.mjs
      - run: node scripts/compare-web-export.mjs
      - run: node node_modules/wrangler/bin/wrangler.js deploy --no-autoconfig --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: check
    if: >-
      github.repository == 'lexencole/convoscroll' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: website-${{ github.sha }}
          path: dist/
      - run: node scripts/write-deploy-config.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      - name: Deploy current main
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          current_main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipped: main has a newer commit"
            exit 0
          fi
          node node_modules/wrangler/bin/wrangler.js deploy --config output/ci-wrangler.json --no-autoconfig
